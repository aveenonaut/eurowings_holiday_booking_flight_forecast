name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Environment and code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install --force "poetry==2.1.4"

      - name: Set up Python and cache the Poetry environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10.18"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install locked dependencies
        run: |
          poetry env use python
          poetry install --with dev --no-ansi

      - name: Check installed dependencies and notebook runtime
        run: |
          poetry run python -m pip check
          poetry run python -c "import ipykernel; print('ipykernel', ipykernel.__version__)"

      - name: Run project, lint and formatting checks
        run: poetry run pre-commit run --all-files --show-diff-on-failure
