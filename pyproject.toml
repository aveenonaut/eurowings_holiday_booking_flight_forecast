[tool.poetry]
name = "eurowings_holiday_booking_flight_forecast"
version = "0.1.0"
description = ""
authors = ["aveenonaut <aveenvas7jb@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.10.18"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.group.dev.dependencies]
ruff = "^0.17.4"
# Compatible with this server's Git 2.30 (newer releases use --deduplicate).
pre-commit = "4.6.0"
pre-commit-hooks = ">=5,<7"
detect-secrets = ">=1.5,<2"

[tool.ruff]
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# Formatting handles indentation; long lines follow the ancillary repo policy.
ignore = ["E111", "E114", "E117", "W191", "E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
